name: Android CI

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v5

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Android SDK
      uses: android-actions/setup-android@v4
      with:
        packages: 'platforms;android-34 build-tools;34.0.0'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v5

    - name: Make gradlew executable
      run: chmod +x ./gradlew

    - name: Build Debug APK (auto on push)
      if: github.event_name == 'push'
      run: ./gradlew assembleDebug --no-daemon --stacktrace

    - name: Upload Debug Artifact
      if: github.event_name == 'push'
      uses: actions/upload-artifact@v6
      with:
        name: timelapse-camera-debug
        path: app/build/outputs/apk/debug/TimeLapseCamera-debug-*.apk
        retention-days: 30

    - name: Build Release APK (manual only)
      if: github.event_name == 'workflow_dispatch'
      run: ./gradlew assembleRelease --no-daemon --stacktrace
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    - name: Upload Release Artifact
      if: github.event_name == 'workflow_dispatch'
      uses: actions/upload-artifact@v6
      with:
        name: timelapse-camera-release
        path: app/build/outputs/apk/release/TimeLapseCamera-v*.apk
        retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest

    steps:
    - name: Download Release APK Artifact
      uses: actions/download-artifact@v6
      with:
        name: timelapse-camera-release
        path: artifact

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v3
      with:
        files: artifact/TimeLapseCamera-v*.apk
        generate_release_notes: true
